<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AS Studio | Client Portal</title><link rel="stylesheet" href="../css/main.css"></head><body><main class="legal"><div class="wrap"><div class="eyebrow">Private workspace</div><h1>Client Portal</h1><p style="max-width:620px;color:#a7a39b">Sign in to access project information. Your existing Firebase authentication remains the source of truth.</p><div class="card" style="max-width:560px;padding:28px;margin-top:40px"><form id="login" class="form"><input class="field" id="email" type="email" placeholder="Email" required><input class="field" id="password" type="password" placeholder="Password" required><button class="btn primary">Sign in</button><div id="status" style="color:#a7a39b;font-size:13px"></div></form><div id="account" hidden><h2 id="welcome"></h2><p id="projects" style="color:#a7a39b">Loading your project workspace…</p><button class="btn" id="logout">Sign out</button></div></div><p><a class="btn" href="../index.html">Back to AS Studio</a></p></div></main><script type="module">import{auth,db}from'../js/firebase.js';import{signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{collection,query,where,getDocs}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';const form=document.querySelector('#login'),status=document.querySelector('#status'),account=document.querySelector('#account'),projects=document.querySelector('#projects');form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Signing in…';try{await signInWithEmailAndPassword(auth,email.value,password.value)}catch(err){status.textContent='Sign-in failed. Check your credentials.'}});onAuthStateChanged(auth,async user=>{if(!user){form.hidden=false;account.hidden=true;return}form.hidden=true;account.hidden=false;welcome.textContent='Welcome back';try{const snap=await getDocs(query(collection(db,'projects'),where('clientUid','==',user.uid)));projects.innerHTML=snap.empty?'No active projects are currently linked to this account.':Array.from(snap.docs).map(d=>{const x=d.data();return `<strong>${x.name||'Project'}</strong><br>Status: ${x.status||'In progress'}<br>Progress: ${x.progress??0}%<br><br>`}).join('')}catch(e){projects.textContent='Your account is signed in, but project data is not currently available.'}});logout.onclick=()=>signOut(auth);</script></body></html>
