<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Portal | AS Studio</title><link rel="stylesheet" href="/css/main.css"></head><body><main class="portal"><div class="panel"><a class="logo" href="/">AS<span>.</span>Studio</a><h1 style="margin-top:30px;font-size:52px">Client portal</h1><p class="muted">Your existing Firebase account is used for portal access.</p><form id="login" class="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn">Sign in</button><p id="err" class="muted" style="color:#ef4444;margin-top:10px" hidden></p></form><div id="welcome" hidden><h2>Signed in</h2><p class="muted">Your project information is available through the existing Firebase-backed client system.</p><button id="out" class="btn ghost">Sign out</button></div></div></main><script type="module">import * as F from '/js/firebase.js';const login=document.querySelector('#login'),welcome=document.querySelector('#welcome'),err=document.querySelector('#err');login.onsubmit=async e=>{e.preventDefault();if(err)err.hidden=true;try{await F.signInWithEmailAndPassword(F.auth,email.value,password.value)}catch(x){if(err){err.textContent=x.message;err.hidden=false}}};F.onAuthStateChanged(F.auth,u=>{login.hidden=!!u;welcome.hidden=!u});document.querySelector('#out').onclick=()=>F.signOut(F.auth)</script></body></html>
