<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Studio inbox</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f1eee7;color:#14302d}main{max-width:980px;margin:auto;padding:30px 20px}h1{font-size:28px;margin:0 0 18px}input,select,button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #bdb8aa;background:#fff}button{background:#14302d;color:#fff;border:0;cursor:pointer}
.card{background:#fff;border:1px solid #d9d4c6;border-radius:14px;padding:18px;margin:12px 0;display:grid;gap:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#5b6760;font-size:14px}pre{white-space:pre-wrap;margin:6px 0;font:inherit}.switch{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.switch input[type=checkbox]{appearance:none;-webkit-appearance:none;width:58px;height:32px;border-radius:999px;background:#bdb8aa;position:relative;cursor:pointer;border:0;padding:0;transition:background .25s}
.switch input[type=checkbox]::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s}.switch input[type=checkbox]:checked{background:#2a6159}.switch input[type=checkbox]:checked::after{transform:translateX(26px)}
.switch input[type=checkbox]:focus-visible{outline:2px solid #14302d;outline-offset:3px}.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}.on{background:#d9ebe5;color:#14302d}.off{background:#ece7da;color:#5b6760}</style></head><body><main>
<h1>Studio inbox</h1><div id="login" class="row"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Sign in</button><button id="reset" style="background:#5b6760">Reset password</button></div>
<p id="msg" class="muted" role="status"></p><div id="app" hidden><div class="row"><span class="muted" id="who"></span><button id="out">Sign out</button></div><div class="card" id="modeCard"><b>Fiverr mode</b><p class="muted" style="margin:0">Off (default): the whole site shows direct, negotiable pricing and every Fiverr button, price and mention is removed. On: the site shows the fixed Fiverr packages and links to your gig.</p>
<div class="switch"><input id="fvOn" type="checkbox" role="switch" aria-label="Fiverr mode"><label for="fvOn"><span id="fvState" class="pill off">Off, direct pricing</span></label></div>
<div class="row"><input id="fvUrl" type="url" style="flex:1;min-width:240px" placeholder="https://www.fiverr.com/your-gig-or-profile" aria-label="Fiverr link"><button id="fvSave">Save</button></div><p id="fvMsg" class="muted" role="status" style="margin:0"></p></div>
<h2 style="font-size:20px;margin:26px 0 4px">Enquiries</h2><div id="list"></div></div></main>
<script type="module">
import {auth,db,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail,signOut,collection,doc,getDoc,setDoc,getDocs,query,orderBy,limit,updateDoc,serverTimestamp} from '../js/firebase.js';
const $=id=>document.getElementById(id);const msg=t=>$('msg').textContent=t||'';
$('go').onclick=async()=>{msg('Signing in...');try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){msg('Sign in failed. Check your email and password.')}};
$('reset').onclick=async()=>{const e=$('em').value.trim();if(!e){msg('Enter your email first.');return}try{await sendPasswordResetEmail(auth,e)}catch(_){}msg('If that account exists, a reset email has been sent.')};
$('out').onclick=()=>signOut(auth);

const fvOn=$('fvOn'),fvUrl=$('fvUrl'),fvMsg=$('fvMsg'),fvState=$('fvState');
const okUrl=u=>/^https:\/\/(www\.)?fiverr\.com\/\S+$/i.test(u);
const paint=()=>{fvState.textContent=fvOn.checked?'On, Fiverr packages':'Off, direct pricing';fvState.className='pill '+(fvOn.checked?'on':'off')};
fvOn.onchange=paint;
$('fvSave').onclick=async()=>{const u=fvUrl.value.trim();if(fvOn.checked&&!okUrl(u)){fvMsg.textContent='To turn Fiverr mode on, paste your real Fiverr link first (it must start with https://www.fiverr.com/).';return}
 try{await setDoc(doc(db,'site_settings','main'),{fiverrMode:fvOn.checked,fiverrUrl:u,updatedAt:serverTimestamp()},{merge:true});fvMsg.textContent='Saved. Visitors see the change the next time a page loads.'}catch(e){fvMsg.textContent='Could not save. Check that this account is an admin.'}};
async function loadMode(){try{const s=await getDoc(doc(db,'site_settings','main'));if(s.exists()){fvOn.checked=!!s.data().fiverrMode;fvUrl.value=s.data().fiverrUrl||''}paint()}catch(e){paint()}}
onAuthStateChanged(auth,async u=>{$('login').hidden=!!u;$('app').hidden=!u;if(!u)return;$('who').textContent=u.email;loadMode();msg('Loading...');
 try{const s=await getDocs(query(collection(db,'inquiries'),orderBy('createdAt','desc'),limit(100)));const L=$('list');L.textContent='';msg(s.empty?'No enquiries yet.':'');
  s.forEach(d=>{const v=d.data();const c=document.createElement('div');c.className='card';
   const h=document.createElement('b');h.textContent=(v.clientName||'')+' · '+(v.businessName||'');
   const ct=document.createElement('div');ct.className='muted';ct.textContent=v.contactChannel||'';
   const p=document.createElement('pre');p.textContent=v.scopeSummary||'';
   const r=document.createElement('div');r.className='row';const sel=document.createElement('select');['new','in_review','contacted','completed'].forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;if(o===v.status)op.selected=true;sel.appendChild(op)});
   sel.onchange=async()=>{try{await updateDoc(doc(db,'inquiries',d.id),{status:sel.value,updatedAt:serverTimestamp()});msg('Updated.')}catch(e){msg('Update not allowed for this account.')}};
   r.append(sel);c.append(h,ct,p,r);L.appendChild(c)})}
 catch(e){msg('This account is not authorised to view enquiries.')}});
</script></body></html>
