<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AS Studio Admin</title><link rel="stylesheet" href="/css/main.css"></head><body><main class="admin"><div class="panel"><a class="logo" href="/">AS<span>.</span>Studio</a><h1 style="margin-top:30px;font-size:52px">Admin workspace</h1><p class="muted">Sign in with the existing Firebase admin account. No new Firebase project is created by this site.</p><form id="login" class="form"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="btn">Sign in</button><p id="err" class="muted" style="color:#ef4444;margin-top:10px" hidden></p></form><div id="dash" hidden><h2>Recent enquiries</h2><div id="items" class="cards"></div><button id="out" class="btn ghost">Sign out</button></div></div></main><script type="module">import * as F from '/js/firebase.js';const login=document.querySelector('#login'),dash=document.querySelector('#dash'),items=document.querySelector('#items'),err=document.querySelector('#err');login.onsubmit=async e=>{e.preventDefault();if(err)err.hidden=true;try{await F.signInWithEmailAndPassword(F.auth,email.value,password.value)}catch(x){if(err){err.textContent=x.message;err.hidden=false}}};F.onAuthStateChanged(F.auth,async u=>{if(!u)return;login.hidden=true;dash.hidden=false;try{const q=F.query(F.collection(F.db,'inquiries'),F.orderBy('createdAt','desc'),F.limit(20));const s=await F.getDocs(q);items.innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="card"><b>${x.businessName||'Inquiry'}</b><p class="muted">${x.clientName||''}<br>${x.contactChannel||''}</p><small>${x.status||'new'}</small></div>`}).join('')||'<p class="muted">No enquiries yet.</p>'}catch(x){items.innerHTML=`<p class="muted" style="color:#ef4444">Error loading inquiries: ${x.message}</p>`}});out.onclick=()=>F.signOut(F.auth)</script></body></html>
