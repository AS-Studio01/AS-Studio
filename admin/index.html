<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AS Studio | Admin</title><link rel="stylesheet" href="../css/main.css"></head><body><main class="legal"><div class="wrap"><div class="eyebrow">Private workspace</div><h1>Studio Admin</h1><p style="max-width:620px;color:#a7a39b">This workspace uses the existing Firebase authentication and Firestore permissions. Only accounts authorized by your Firebase rules should be able to access protected records.</p><div class="card" style="padding:28px;margin-top:40px"><form id="login" class="form"><input class="field" id="email" type="email" placeholder="Admin email" required><input class="field" id="password" type="password" placeholder="Password" required><button class="btn primary">Sign in</button><div id="status" style="color:#a7a39b;font-size:13px"></div></form><section id="dash" hidden><h2>Inquiries</h2><div id="list" style="color:#bdb9b1">Loading…</div><button class="btn" id="logout">Sign out</button></section></div><p><a class="btn" href="../index.html">Back to AS Studio</a></p></div></main><script type="module">import{auth,getRecentInquiries}from'../js/firebase.js';import{signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';const form=document.querySelector('#login'),dash=document.querySelector('#dash'),status=document.querySelector('#status'),list=document.querySelector('#list');form.addEventListener('submit',async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,email.value,password.value)}catch(err){status.textContent='Sign-in failed.'}});onAuthStateChanged(auth,async u=>{if(!u){form.hidden=false;dash.hidden=true;return}form.hidden=true;dash.hidden=false;try{const rows=await getRecentInquiries();list.innerHTML=rows.length?rows.map(x=>`<div style="padding:18px 0;border-bottom:1px solid rgba(255,255,255,.1)"><strong>${x.clientName||'Unnamed'}</strong><br>${x.businessName||''}<br>${x.contactChannel||''}<br>${x.scopeSummary||''}<br><small>${x.status||'new'}</small></div>`).join(''):'No inquiries found.'}catch(e){list.textContent='The signed-in account does not have permission to read inquiries.'}});logout.onclick=()=>signOut(auth);</script></body></html>
