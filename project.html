<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AS Studio project case study."><meta property="og:type" content="article"><title>Project | AS Studio</title><link rel="stylesheet" href="css/styles.css"></head><body><div class="cursor-dot"></div><div class="scroll-progress"></div><header class="site-header"><a class="brand" href="index.html"><span>AS</span> STUDIO</a><nav id="main-nav"><a href="work.html">Work</a><a href="services.html">Services</a><a href="index.html#process">Process</a><a href="index.html#contact">Contact</a></nav><a class="header-cta" href="index.html#contact">Start a project <span>↗</span></a><button class="menu" aria-expanded="false" aria-controls="main-nav">Menu</button></header><main id="project-root"></main><footer><div class="footer-top"><a class="brand" href="index.html"><span>AS</span> STUDIO</a><div><p>Digital experiences for ambitious businesses.</p><a href="mailto:asstudioofficial001@gmail.com">asstudioofficial001@gmail.com</a></div><a class="back-top" href="#top">Back to top ↑</a></div><div class="footer-bottom"><span>© <span data-year></span> AS Studio. Selected work is presented as studio concepts.</span><div><a href="public/legal/privacy.html">Privacy</a><a href="public/legal/terms.html">Terms</a><a href="public/legal/disclaimer.html">Disclaimer</a><a href="public/legal/cancellation-refund.html">Cancellation & Refund</a></div></div></footer><script src="js/app.js"></script><script>
const projects={
apex:{name:'Apex Residences',category:'Luxury real estate · Brand experience',image:'public/assets/apex-residences-hero.jpg',intro:'A private residential concept built around atmosphere, materiality and the feeling of arriving somewhere exceptional.',problem:'A premium property brand needs more than a gallery of rooms. The digital experience has to communicate the level of the address before a visitor ever asks for a brochure.',direction:'We treated the website like an architectural walkthrough. Large imagery creates the first impression, restrained typography establishes confidence, and every enquiry path stays visible without becoming aggressive.',sections:['Position the property as a considered lifestyle, not a list of specifications.','Use cinematic pacing to let architecture and material details do the selling.','Make private enquiry feel discreet, immediate and high value.']},
atelier:{name:'Atelier North',category:'Architecture · Interior design',image:'public/assets/atelier-north-hero.jpg',intro:'An editorial portfolio concept for a design practice where the work itself should lead the conversation.',problem:'Architecture portfolios often become galleries with no narrative. The opportunity was to give each project a clear point of view while keeping the interface quiet enough for the work to dominate.',direction:'The structure favors large visual rhythm, short project statements and generous negative space. Navigation stays deliberately simple so visitors can move from one body of work to the next without friction.',sections:['Let photography carry the visual weight.','Give each project a reason to be remembered.','Turn expertise into a point of view instead of a list of services.']},
nova:{name:'Nova Dental Care',category:'Healthcare · Patient experience',image:'public/assets/nova-dental-hero.jpg',intro:'A warm, contemporary clinic concept designed to make the first digital interaction feel as reassuring as the visit itself.',problem:'Healthcare websites can feel clinical, crowded or overly generic. The challenge was to balance medical credibility with a calm experience that makes booking feel straightforward.',direction:'The experience uses soft visual hierarchy, clear treatment pathways and prominent appointment actions. The tone is confident without sounding corporate or cold.',sections:['Reduce uncertainty before the first appointment.','Explain services in plain language.','Make booking and contact paths obvious on every device.']}}
const key=new URLSearchParams(location.search).get('project')||'apex'; const p=projects[key]||projects.apex; document.title=`${p.name} | AS Studio`; document.querySelector('meta[name="description"]').content=p.intro;
document.getElementById('project-root').innerHTML=`<section class="project-detail-hero"><div class="hero-image"><img src="${p.image}" alt="${p.name} concept"></div><div class="project-detail-copy reveal"><div class="detail-meta"><span>${p.category}</span><span>Studio concept</span></div><h1>${p.name}</h1><p>${p.intro}</p></div></section><section class="detail-section"><div class="detail-grid"><div><div class="section-kicker">The brief</div><h2>${p.problem}</h2></div><div><p>${p.direction}</p><a class="button button-dark" href="index.html#contact">Build something like this <span>↗</span></a></div></div><img class="detail-image" src="${p.image}" alt="${p.name} visual direction" loading="lazy"><div class="detail-grid" style="margin-top:7rem"><h2>Design principles.</h2><div class="feature-list" style="background:transparent">${p.sections.map((x,i)=>`<div style="padding:1.4rem 0;border-bottom:1px solid var(--line);display:flex;gap:1rem"><strong>0${i+1}</strong><span>${x}</span></div>`).join('')}</div></div></section><section class="detail-callout detail-section"><div><div class="section-kicker">Next project</div><h2>${key==='apex'?'Atelier North':key==='atelier'?'Nova Dental Care':'Apex Residences'}</h2><p>Move through the selected work and see how the same design discipline changes with the business problem.</p><a class="button button-dark" href="project.html?project=${key==='apex'?'atelier':key==='atelier'?'nova':'apex'}">View next project <span>↗</span></a></div></section>`;
</script></body></html>
