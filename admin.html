<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AS Studio Admin</title><link rel="stylesheet" href="css/styles.css"></head><body class="admin-shell"><div id="login-view" class="auth-shell"><div class="auth-card"><p class="eyebrow-small">AS Studio · Private</p><h1>Admin workspace.</h1><p>Sign in with an authorized studio account. This area is intentionally excluded from search indexing.</p><form id="login-form"><div class="field"><label>Email</label><input type="email" name="email" required autocomplete="username"></div><div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div><button class="button button-dark" type="submit">Sign in <span>↗</span></button><p id="login-note" class="form-note"></p></form><p class="auth-switch"><a href="index.html">Return to website</a></p></div></div><div id="admin-view" hidden><header class="appbar"><a class="brand" href="index.html"><span>AS</span> STUDIO</a><nav><span id="admin-email"></span><button id="logout" class="text-link">Sign out</button></nav></header><div class="app-shell"><aside class="sidebar"><a href="#overview" data-tab="overview" class="active">Overview</a><a href="#inquiries" data-tab="inquiries">Inquiries</a><a href="#projects" data-tab="projects">Projects</a><a href="#seo" data-tab="seo">SEO</a><a href="#legal" data-tab="legal">Legal pages</a><a href="#settings" data-tab="settings">Site settings</a></aside><main class="dashboard"><div id="panel-overview"></div><div id="panel-inquiries" hidden></div><div id="panel-projects" hidden></div><div id="panel-seo" hidden></div><div id="panel-legal" hidden></div><div id="panel-settings" hidden></div></main></div></div><script>window.AS_FIREBASE_CONFIG={apiKey:'AIzaSyA1km1IvXjyPTkO0grVOunMorlOoARLd2w',authDomain:'profound-handbook-z3skh.firebaseapp.com',projectId:'profound-handbook-z3skh',storageBucket:'profound-handbook-z3skh.firebasestorage.app',messagingSenderId:'34016814266',appId:'1:34016814266:web:30865e0746c21237d04e83'};</script><script type="module">
import {db,auth,onAuthStateChanged,signInWithEmailAndPassword,signOut,collection,getDocs,doc,getDoc,setDoc,updateDoc,deleteDoc,query,orderBy,limit,serverTimestamp} from './js/firebase-app.js';
const admins=new Set(['asstudioofficial001@gmail.com','asbusinessofficial01@gmail.com','sahina724462s@gmail.com']);
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let current=null, cache={inquiries:[],projects:[],seo:[],legal:[]};
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{await signInWithEmailAndPassword(auth,f.get('email'),f.get('password'));}catch(err){$('#login-note').textContent=err.message.replace('Firebase: ','');}}); $('#logout').addEventListener('click',()=>signOut(auth));
function show(id){document.querySelectorAll('[id^="panel-"]').forEach(x=>x.hidden=true);$('#panel-'+id).hidden=false;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));location.hash=id; render(id)}
async function readAll(name){const s=await getDocs(collection(db,name));return s.docs.map(d=>({id:d.id,...d.data()}));}
async function load(){cache.inquiries=await readAll('inquiries');cache.projects=await readAll('client_projects');cache.seo=await readAll('seo_pages');cache.legal=await readAll('site_content');}
function render(tab){if(tab==='overview'){$('#panel-overview').innerHTML=`<div class="dashboard-head"><div><div class="eyebrow-small">Studio control</div><h1>Good morning.</h1><p>One place for leads, delivery, SEO and site content.</p></div></div><div class="dashboard-grid"><div class="stat-card"><strong>${cache.inquiries.length}</strong><span>Total inquiries</span></div><div class="stat-card"><strong>${cache.inquiries.filter(x=>x.status==='new').length}</strong><span>New inquiries</span></div><div class="stat-card"><strong>${cache.projects.length}</strong><span>Client projects</span></div><div class="stat-card"><strong>${cache.seo.length}</strong><span>SEO records</span></div></div><div class="panel"><h2>Latest inquiries</h2>${cache.inquiries.slice(-5).reverse().map(x=>`<div class="portal-project"><div><h3>${esc(x.businessName||x.clientName)}</h3><p>${esc(x.contactChannel)} · ${esc(x.scopeSummary||'')}</p></div><span class="badge">${esc(x.status||'new')}</span></div>`).join('')||'<div class="empty">No inquiries yet.</div>'}</div>`}
if(tab==='inquiries'){$('#panel-inquiries').innerHTML=`<div class="dashboard-head"><div><div class="eyebrow-small">Pipeline</div><h1>Inquiries</h1><p>Review and update incoming project briefs.</p></div></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Business</th><th>Contact</th><th>Brief</th><th>Status</th></tr></thead><tbody>${cache.inquiries.map(x=>`<tr><td>${esc(x.businessName||'Not provided')}<br><small>${esc(x.clientName)}</small></td><td>${esc(x.contactChannel)}</td><td>${esc(x.scopeSummary)}</td><td><select data-inquiry="${x.id}"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='in_review'?'selected':''}>in_review</option><option ${x.status==='contacted'?'selected':''}>contacted</option><option ${x.status==='completed'?'selected':''}>completed</option></select></td></tr>`).join('')||'<tr><td colspan="4">No inquiries.</td></tr>'}</tbody></table></div></div>`;document.querySelectorAll('[data-inquiry]').forEach(s=>s.onchange=async()=>{await updateDoc(doc(db,'inquiries',s.dataset.inquiry),{status:s.value,updatedAt:serverTimestamp()});await load();render('inquiries')})}
if(tab==='projects'){$('#panel-projects').innerHTML=`<div class="dashboard-head"><div><div class="eyebrow-small">Delivery</div><h1>Client projects</h1><p>Manage portal-visible project status and milestones.</p></div></div><div class="panel"><form id="project-form" class="editor-grid"><div class="field"><label>Project ID</label><input name="id" required placeholder="project-001"></div><div class="field"><label>Client UID</label><input name="clientUid" required placeholder="Firebase user UID"></div><div class="field"><label>Project name</label><input name="name" required></div><div class="field"><label>Status</label><select name="status"><option>Discovery</option><option>Design</option><option>Build</option><option>Review</option><option>Launched</option></select></div><div class="field"><label>Progress %</label><input name="progress" type="number" min="0" max="100" value="0"></div><div class="field"><label>Next milestone</label><input name="nextMilestone"></div><div class="field wide"><label>Summary</label><textarea name="summary" rows="3"></textarea></div><button class="button button-dark" type="submit">Save project</button></form></div><div class="panel">${cache.projects.map(x=>`<div class="portal-project"><div><h3>${esc(x.name)}</h3><p>${esc(x.clientUid)} · ${esc(x.status)} · ${esc(x.progress)}%</p></div><span class="badge">${esc(x.nextMilestone||'No next milestone')}</span></div>`).join('')||'<div class="empty">No projects yet.</div>'}</div>`;$('#project-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('id');await setDoc(doc(db,'client_projects',id),{clientUid:f.get('clientUid'),name:f.get('name'),status:f.get('status'),progress:Number(f.get('progress')),nextMilestone:f.get('nextMilestone'),summary:f.get('summary'),updatedAt:serverTimestamp()},{merge:true});await load();render('projects')}}
if(tab==='seo'){$('#panel-seo').innerHTML=`<div class="dashboard-head"><div><div class="eyebrow-small">Search presence</div><h1>SEO editor</h1><p>Set title, description and social sharing data for each page.</p></div></div><div class="panel"><form id="seo-form" class="editor-grid"><div class="field"><label>Page key</label><input name="id" placeholder="home" required></div><div class="field"><label>Canonical URL</label><input name="canonical" placeholder="https://example.com/"></div><div class="field wide"><label>Page title</label><input name="title" required></div><div class="field wide"><label>Meta description</label><textarea name="description" rows="3" required></textarea></div><div class="field"><label>OpenGraph title</label><input name="ogTitle"></div><div class="field"><label>OpenGraph image</label><input name="ogImage"></div><button class="button button-dark" type="submit">Save SEO</button></form></div><div class="panel"><table class="data-table"><thead><tr><th>Page</th><th>Title</th><th>Description</th></tr></thead><tbody>${cache.seo.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.title)}</td><td>${esc(x.description)}</td></tr>`).join('')||'<tr><td colspan="3">No SEO records yet.</td></tr>'}</tbody></table></div>`;$('#seo-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('id');await setDoc(doc(db,'seo_pages',id),{title:f.get('title'),description:f.get('description'),canonical:f.get('canonical'),ogTitle:f.get('ogTitle'),ogImage:f.get('ogImage'),updatedAt:serverTimestamp()},{merge:true});await load();render('seo')}}
if(tab==='legal'){$('#panel-legal').innerHTML=`<div class="dashboard-head"><div><div class="eyebrow-small">Content</div><h1>Legal pages</h1><p>Edit published legal content without touching the code.</p></div></div><div class="panel"><form id="legal-form" class="editor-grid"><div class="field"><label>Document</label><select name="id"><option value="privacy">Privacy Policy</option><option value="terms">Terms of Service</option><option value="disclaimer">Disclaimer</option><option value="cancellation-refund">Cancellation & Refund</option></select></div><div class="field wide"><label>HTML content</label><textarea name="html" rows="18" required></textarea></div><button class="button button-dark" type="submit">Publish document</button></form></div>`;$('#legal-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('id');await setDoc(doc(db,'site_content',id),{key:`legal_${id}`,type:'legal',html:f.get('html'),updatedAt:serverTimestamp()},{merge:true});alert('Saved. The public legal page will use this record when Firebase is available.')}}
if(tab==='settings'){$('#panel-settings').innerHTML=`<div class="dashboard-head"><div><div class="eyebrow-small">Global content</div><h1>Site settings</h1><p>Keep public contact details and studio defaults in one place.</p></div></div><div class="panel"><form id="settings-form" class="editor-grid"><div class="field"><label>Studio email</label><input name="email" value="asstudioofficial001@gmail.com"></div><div class="field"><label>Response time</label><input name="response" value="Within 1 business day"></div><div class="field wide"><label>Footer statement</label><input name="footer" value="Digital experiences for ambitious businesses."></div><button class="button button-dark" type="submit">Save settings</button><p id="settings-note" class="form-note"></p></form></div>`;$('#settings-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await setDoc(doc(db,'site_settings','global'),{email:f.get('email'),response:f.get('response'),footer:f.get('footer'),updatedAt:serverTimestamp()},{merge:true});$('#settings-note').textContent='Settings saved.'}}}
async function start(user){if(!user)return; if(!admins.has((user.email||'').toLowerCase())){await signOut(auth);$('#login-note').textContent='This account is not authorized for the admin workspace.';return;} current=user;$('#login-view').hidden=true;$('#admin-view').hidden=false;$('#admin-email').textContent=user.email;await load();show(location.hash.slice(1)||'overview')}
onAuthStateChanged(auth,start);document.querySelectorAll('[data-tab]').forEach(a=>a.onclick=e=>{e.preventDefault();show(a.dataset.tab)});
</script></body></html>
