    <script>
      (function() {
        try {
          var saved = localStorage.getItem('as_studio_theme_preference');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Dynamic Canonical & OpenGraph URL Synchronization Script -->
    <script>
      (function () {

          var canonicalEl = document.getElementById('canonical-url');
          if (canonicalEl) canonicalEl.setAttribute('href', currentUrl);
          var ogUrlEl = document.getElementById('og-url');
          if (ogUrlEl) ogUrlEl.setAttribute('content', currentUrl);
