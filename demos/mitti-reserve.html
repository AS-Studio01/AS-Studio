<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reserve a Table — Mitti Café</title>
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="demo-bar"><span>AS Studio · Live Demo</span><a href="/work">← Back to all demos</a></div>
<header class="nav">
  <div class="wrap nav-in">
    <a href="/demos/mitti" class="brand">Mitti Café</a>
    <nav class="nav-links" aria-label="Mitti Café">
      <a href="/demos/mitti">Home</a>
      <a href="/demos/mitti-menu">Menu</a>
      <a href="/demos/mitti-reserve">Reserve</a>
    </nav>
    <a class="btn btn-accent btn-sm" href="/demos/mitti-menu">Order Pickup</a>
  </div>
</header>
<main>
  <section class="sec">
    <div class="wrap">
      <div class="sec-head">
        <h1>Reserve a Courtyard Table</h1>
        <p class="lead">Open Tue – Sun · 8:00 AM to 10:30 PM · Boring Road, Patna</p>
      </div>
      <div class="menu-item" style="max-width:520px;">
        <h3>Tonight's Available Slots</h3>
        <p>Select a time to hold your table instantly.</p>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;">
          <button class="btn btn-ghost btn-sm" type="button" data-demo-toast="Table for 2 reserved at 6:30 PM!">6:30 PM</button>
          <button class="btn btn-ghost btn-sm" type="button" data-demo-toast="Table for 2 reserved at 7:30 PM!">7:30 PM</button>
          <button class="btn btn-ghost btn-sm" type="button" data-demo-toast="Table for 4 reserved at 8:30 PM!">8:30 PM</button>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="demo.js"></script>
</body>
</html>
