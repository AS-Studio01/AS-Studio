<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Rao &amp; Partners Chambers">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181d24"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0c18c"/>
      <stop offset="50%" stop-color="#c59f60"/>
      <stop offset="100%" stop-color="#9a7536"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#c59f60" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c59f60" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Subtle architectural grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5">
    <line x1="120" y1="0" x2="120" y2="900"/>
    <line x1="360" y1="0" x2="360" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="840" y1="0" x2="840" y2="900"/>
    <line x1="1080" y1="0" x2="1080" y2="900"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
  </g>

  <!-- Outer ornamental border -->
  <rect x="48" y="48" width="1104" height="804" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="58" y="58" width="1084" height="784" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner embellishments -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.7" fill="none">
    <path d="M48 90h42v-42"/>
    <path d="M1152 90h-42v-42"/>
    <path d="M48 810h42v42"/>
    <path d="M1152 810h-42v42"/>
  </g>

  <!-- Architectural Classical Tribunal / Chamber Silhouette -->
  <g transform="translate(600, 390)" text-anchor="middle">
    <!-- Pediment (classical roof triangle) -->
    <polygon points="0,-180 -260,-90 260,-90" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.85"/>
    <polygon points="0,-165 -230,-100 230,-100" fill="#14181f" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.35"/>
    
    <!-- Entablature beam -->
    <rect x="-260" y="-90" width="520" height="24" fill="#181e26" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.8"/>
    
    <!-- Columns (Four classical Doric/Ionic pillars) -->
    <g fill="#161b22" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.75">
      <rect x="-230" y="-66" width="34" height="220"/>
      <rect x="-95" y="-66" width="34" height="220"/>
      <rect x="61" y="-66" width="34" height="220"/>
      <rect x="196" y="-66" width="34" height="220"/>
    </g>

    <!-- Column Fluting lines -->
    <g stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.25">
      <line x1="-213" y1="-60" x2="-213" y2="148"/>
      <line x1="-78" y1="-60" x2="-78" y2="148"/>
      <line x1="78" y1="-60" x2="78" y2="148"/>
      <line x1="213" y1="-60" x2="213" y2="148"/>
    </g>

    <!-- Base steps (Stylobate) -->
    <rect x="-275" y="154" width="550" height="18" fill="#1b212a" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.8"/>
    <rect x="-295" y="172" width="590" height="16" fill="#14181f" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Scales of Justice Emblem in Center -->
    <g transform="translate(0, 42)" stroke="url(#goldGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Central Pillar -->
      <line x1="0" y1="-44" x2="0" y2="60" stroke-width="3"/>
      <!-- Finial on top -->
      <circle cx="0" cy="-48" r="4" fill="url(#goldGrad)"/>
      <!-- Balance beam -->
      <line x1="-50" y1="-32" x2="50" y2="-32" stroke-width="2.5"/>
      <!-- Left pan chains & bowl -->
      <line x1="-50" y1="-32" x2="-64" y2="10" stroke-width="1.2" stroke-opacity="0.8"/>
      <line x1="-50" y1="-32" x2="-36" y2="10" stroke-width="1.2" stroke-opacity="0.8"/>
      <path d="M-68 10 Q -50 26 -32 10 Z" fill="#202630" stroke-width="1.8"/>
      <!-- Right pan chains & bowl -->
      <line x1="50" y1="-32" x2="36" y2="10" stroke-width="1.2" stroke-opacity="0.8"/>
      <line x1="50" y1="-32" x2="64" y2="10" stroke-width="1.2" stroke-opacity="0.8"/>
      <path d="M32 10 Q 50 26 68 10 Z" fill="#202630" stroke-width="1.8"/>
      <!-- Base stand -->
      <path d="M-24 60h48" stroke-width="3"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="600" y="690" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="28" letter-spacing="8" fill="url(#goldGrad)" font-weight="600">THE LAW CHAMBERS</text>
  <line x1="480" y1="714" x2="720" y2="714" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="600" y="748" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="16" letter-spacing="4" fill="#a4b0bd">COMMERCIAL DISPUTE RESOLUTION · MUMBAI &amp; PUNE</text>
</svg>
